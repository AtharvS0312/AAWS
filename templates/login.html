{% extends 'base.html' %}

{% block title %}Log In | TravelGo Platform{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto; padding: 0 1.5rem;">
  
  <div style="background: var(--bg-card); border: 1px solid var(--bg-card-border); border-radius: var(--radius-xl); padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-logo" style="justify-content: center; font-size: 1.8rem; margin-bottom: 0.5rem;">
        <i class="fas fa-plane-departure"></i> TravelGo
      </div>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Log in to manage bookings & travel history</p>
    </div>

    <!-- PRE-POPULATED DEMO CREDENTIALS BOX FOR QUICK EVALUATION -->
    <div style="background: rgba(99, 102, 241, 0.12); border: 1px solid var(--primary); border-radius: var(--radius-md); padding: 0.85rem 1rem; margin-bottom: 1.5rem; font-size: 0.82rem; color: #cbd5e1;">
      <div style="font-weight: 700; color: white; margin-bottom: 4px;"><i class="fas fa-key" style="color: var(--primary);"></i> Quick Demo Account:</div>
      <div>Email: <code style="background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; color: #a5b4fc;">demo@travelgo.com</code></div>
      <div>Password: <code style="background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; color: #a5b4fc;">password123</code></div>
    </div>

    <form action="{{ url_for('login') }}" method="POST" style="display: flex; flex-direction: column; gap: 1.2rem;">
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> Email Address</label>
        <input type="email" name="email" class="form-input" placeholder="you@example.com" value="demo@travelgo.com" required>
      </div>

      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <input type="password" name="password" class="form-input" placeholder="••••••••" value="password123" required>
      </div>

      <button type="submit" class="btn btn-primary" style="padding: 0.85rem; width: 100%; font-size: 1rem; margin-top: 0.5rem;">
        Log In <i class="fas fa-right-to-bracket"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 600;">Sign up free</a>
    </div>
  </div>

</div>
{% endblock %}

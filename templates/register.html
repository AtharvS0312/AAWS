{% extends 'base.html' %}

{% block title %}Create Account | TravelGo Platform{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto; padding: 0 1.5rem;">
  
  <div style="background: var(--bg-card); border: 1px solid var(--bg-card-border); border-radius: var(--radius-xl); padding: 2.5rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-logo" style="justify-content: center; font-size: 1.8rem; margin-bottom: 0.5rem;">
        <i class="fas fa-plane-departure"></i> TravelGo
      </div>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Register to start booking travel instantly</p>
    </div>

    <form action="{{ url_for('register') }}" method="POST" style="display: flex; flex-direction: column; gap: 1.2rem;">
      <div class="form-group">
        <label><i class="fas fa-user"></i> Full Name</label>
        <input type="text" name="name" class="form-input" placeholder="e.g. Rahul Sharma" required>
      </div>

      <div class="form-group">
        <label><i class="fas fa-envelope"></i> Email Address</label>
        <input type="email" name="email" class="form-input" placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <input type="password" name="password" class="form-input" placeholder="Minimum 6 characters" required>
      </div>

      <div class="form-group">
        <label><i class="fas fa-shield"></i> Confirm Password</label>
        <input type="password" name="confirm_password" class="form-input" placeholder="Re-enter password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="padding: 0.85rem; width: 100%; font-size: 1rem; margin-top: 0.5rem;">
        Create Account <i class="fas fa-user-plus"></i>
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
      Already registered? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600;">Log in here</a>
    </div>
  </div>

</div>
{% endblock %}
